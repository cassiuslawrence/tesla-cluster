<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Cluster</title>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0a0a" />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:             #0a0a0a;
      --surface:        #141414;
      --border:         rgba(255,255,255,0.07);
      --text-primary:   #ffffff;
      --text-dim:       rgba(255,255,255,0.22);
      --text-secondary: rgba(255,255,255,0.40);
      --accent:         #e82127;
      --accent-dim:     rgba(232,33,39,0.12);
      --warn:           #f5a623;
      --speed-size:     clamp(72px, 17vw, 136px);
    }
    .light {
      --bg:             #efefef;
      --surface:        #f8f8f8;
      --border:         rgba(0,0,0,0.07);
      --text-primary:   #0d0d0d;
      --text-dim:       rgba(0,0,0,0.18);
      --text-secondary: rgba(0,0,0,0.38);
      --accent:         #e82127;
      --accent-dim:     rgba(232,33,39,0.10);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'DM Sans', sans-serif;
      transition: background .35s ease, color .35s ease;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #app {
      width: 100vw; height: 100vh;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 4.5vw;
      gap: 3vw;
    }

    /* ── LEFT ── */
    .panel-left {
      display: flex;
      flex-direction: column;
      gap: 2.2vh;
      align-items: flex-start;
    }

    .compass-wrap { display: flex; flex-direction: column; gap: .5vh; }

    .lbl {
      font-size: clamp(7px, 1.2vw, 10px);
      font-weight: 500;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .compass-ring {
      width: clamp(52px, 9.5vw, 82px);
      height: clamp(52px, 9.5vw, 82px);
    }
    .compass-ring svg {
      width: 100%; height: 100%;
      transition: transform .55s cubic-bezier(.34,1.2,.64,1);
    }

    .cardinal {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(12px, 2vw, 17px);
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--text-primary);
      margin-top: .4vh;
    }

    .rule { width: 28px; height: 1px; background: var(--border); }

    .gps-row { display: flex; align-items: center; gap: .55em; }

    .gps-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background .4s, box-shadow .4s;
    }
    .gps-dot.none      { background: var(--text-dim); }
    .gps-dot.acquiring { background: var(--warn); box-shadow: 0 0 7px rgba(245,166,35,.35); animation: blink 1.1s infinite; }
    .gps-dot.locked    { background: #4cd964; box-shadow: 0 0 7px rgba(76,217,100,.3); animation: blink 2.6s infinite; }

    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.35;} }

    .gps-acc {
      font-size: clamp(8px, 1.3vw, 11px);
      color: var(--text-secondary);
      letter-spacing: .04em;
    }

    .bars-wrap { display: flex; flex-direction: column; gap: .4vh; }
    .bars {
      display: flex;
      align-items: flex-end;
      gap: clamp(2px,.4vw,4px);
      height: clamp(12px,2.2vh,18px);
    }
    .bar {
      width: clamp(4px,.7vw,7px);
      border-radius: 2px 2px 1px 1px;
      background: var(--border);
      transition: background .5s ease;
    }
    .bar:nth-child(1){ height:25%; }
    .bar:nth-child(2){ height:50%; }
    .bar:nth-child(3){ height:75%; }
    .bar:nth-child(4){ height:100%; }

    /* GPS quality colors — warm to cool gradient */
    .bar.q1 { background: #e82127; }
    .bar.q2 { background: #f5a623; }
    .bar.q3 { background: #f0d060; }
    .bar.q4 { background: #4cd964; }

    /* ── CENTER ── */
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* G-force ring container */
    .gforce-ring {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* The canvas sits behind the speed number */
    #gforceCanvas {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      border-radius: 50%;
    }

    .speed-num {
      position: relative;
      z-index: 2;
      font-family: 'Rajdhani', sans-serif;
      font-size: var(--speed-size);
      font-weight: 700;
      line-height: .88;
      letter-spacing: -.02em;
      color: var(--text-primary);
      text-align: center;
      min-width: 3ch;
    }
    .speed-num.speeding { color: var(--accent); }
    .speed-num.dim { opacity: .25; }

    .unit {
      font-size: clamp(9px, 1.7vw, 14px);
      font-weight: 300;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-top: .6em;
    }

    /* ── RIGHT ── */
    .panel-right {
      display: flex;
      flex-direction: column;
      gap: 2.2vh;
      align-items: flex-end;
    }

    .time-val {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(20px, 4.6vw, 42px);
      font-weight: 500;
      letter-spacing: .02em;
      line-height: 1;
      color: var(--text-primary);
      text-align: right;
    }
    .time-date {
      font-size: clamp(7px, 1.2vw, 11px);
      color: var(--text-secondary);
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-top: .25em;
    }

    .icon-btn {
      display: flex; align-items: center; justify-content: center;
      width: clamp(30px,4.5vw,40px);
      height: clamp(30px,4.5vw,40px);
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      transition: transform .15s, background .3s;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-btn:active { transform: scale(.88); }
    .icon-btn svg { width: 42%; height: 42%; fill: var(--text-secondary); transition: fill .3s; }

    body::after {
      content:'';
      position:fixed; inset:0;
      background: repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.022) 3px,rgba(0,0,0,.022) 4px);
      pointer-events:none;
      z-index:999;
    }

    #installBtn {
      position:fixed; bottom:1.8vh; right:1.8vw;
      width:26px; height:26px;
      border-radius:50%;
      border:1px solid var(--border);
      background:var(--surface);
      display:none; align-items:center; justify-content:center;
      cursor:pointer; opacity:.45; z-index:500;
      transition:opacity .2s, transform .15s;
      -webkit-tap-highlight-color:transparent;
    }
    #installBtn.show { display:flex; }
    #installBtn:active { transform:scale(.88); opacity:1; }
    #installBtn svg { width:12px; height:12px; fill:var(--text-secondary); }

    #wakeBadge {
      position:fixed; bottom:1.6vh; left:50%; transform:translateX(-50%);
      font-size:8px; letter-spacing:.18em; text-transform:uppercase;
      color:var(--text-dim); pointer-events:none; z-index:400;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- LEFT -->
  <div class="panel-left">
    <div class="compass-wrap">
      <span class="lbl">Direção</span>
      <div class="compass-ring">
        <svg id="compassSvg" viewBox="0 0 82 82" fill="none">
          <circle cx="41" cy="41" r="39.5" stroke="var(--border)" stroke-width="1.2"/>
          <g stroke="var(--text-dim)" stroke-width="1">
            <line x1="41" y1="3"  x2="41" y2="10"/>
            <line x1="79" y1="41" x2="72" y2="41"/>
            <line x1="41" y1="79" x2="41" y2="72"/>
            <line x1="3"  y1="41" x2="10" y2="41"/>
          </g>
          <polygon points="41,9 38.5,41 41,47 43.5,41" fill="var(--accent)"/>
          <polygon points="41,73 38.5,41 41,35 43.5,41" fill="var(--text-dim)"/>
          <circle cx="41" cy="41" r="3.5" fill="var(--surface)" stroke="var(--border)" stroke-width="1.2"/>
        </svg>
      </div>
      <span class="cardinal" id="cardinalEl">—</span>
    </div>

    <div class="rule"></div>

    <div class="gps-row">
      <span class="gps-dot none" id="gpsDot"></span>
      <span class="gps-acc" id="gpsAcc">sem sinal</span>
    </div>

    <div class="bars-wrap">
      <span class="lbl">GPS</span>
      <div class="bars">
        <span class="bar" id="b1"></span>
        <span class="bar" id="b2"></span>
        <span class="bar" id="b3"></span>
        <span class="bar" id="b4"></span>
      </div>
    </div>
  </div>

  <!-- CENTER -->
  <div class="center">
    <div class="gforce-ring" id="gforceRing">
      <canvas id="gforceCanvas"></canvas>
      <div class="speed-num dim" id="speedEl">—</div>
    </div>
    <div class="unit">km/h</div>
  </div>

  <!-- RIGHT -->
  <div class="panel-right">
    <div>
      <div class="time-val" id="timeEl">--:--</div>
      <div class="time-date" id="dateEl">—</div>
    </div>
    <div class="rule" style="margin-left:auto;"></div>
    <button class="icon-btn" id="themeBtn" aria-label="Tema">
      <svg id="themeIco" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</div>

<div id="wakeBadge"></div>
<button id="installBtn" aria-label="Instalar">
  <svg viewBox="0 0 24 24"><path d="M12 3v13m0 0l-4-4m4 4l4-4M3 18v2a1 1 0 001 1h16a1 1 0 001-1v-2"/></svg>
</button>

<script>
// ── PWA ──
(function(){
  const manifest={name:"Tesla Cluster",short_name:"Cluster",start_url:"./",display:"fullscreen",orientation:"landscape",background_color:"#0a0a0a",theme_color:"#0a0a0a",icons:[{src:"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#0a0a0a" rx="80"/><text x="256" y="340" font-size="280" text-anchor="middle" font-family="sans-serif" fill="#e82127" font-weight="bold">T</text></svg>'),sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};
  const link=document.createElement('link');link.rel='manifest';link.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/json'}));document.head.appendChild(link);
  if('serviceWorker' in navigator){const sw=`const C='cv3';self.addEventListener('install',e=>{self.skipWaiting();});self.addEventListener('activate',e=>{clients.claim();caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k))));});self.addEventListener('fetch',e=>{e.respondWith(caches.open(C).then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(res=>{c.put(e.request,res.clone());return res;}))).catch(()=>fetch(e.request)));});`;navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'})),{scope:'./'}).catch(()=>{});}
})();
let deferred=null;
const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;installBtn.classList.add('show');});
installBtn.addEventListener('click',async()=>{if(!deferred)return;deferred.prompt();const{outcome}=await deferred.userChoice;if(outcome==='accepted')installBtn.classList.remove('show');deferred=null;});
window.addEventListener('appinstalled',()=>installBtn.classList.remove('show'));

// ── THEME ──
let dark=true;
const themeBtn=document.getElementById('themeBtn'),themeIco=document.getElementById('themeIco');
const MOON='M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z';
const SUN='M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41M12 6a6 6 0 1 0 0 12A6 6 0 0 0 12 6z';
themeBtn.addEventListener('click',()=>{dark=!dark;document.body.classList.toggle('light',!dark);themeIco.innerHTML=dark?`<path d="${MOON}"/>`:`<path d="${SUN}" fill="none" stroke="var(--text-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;});

// ── CLOCK ──
const timeEl=document.getElementById('timeEl'),dateEl=document.getElementById('dateEl');
const DAYS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],MONTHS=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
function tick(){const n=new Date();timeEl.textContent=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;dateEl.textContent=`${DAYS[n.getDay()]} · ${n.getDate()} ${MONTHS[n.getMonth()]}`;}
tick();setInterval(tick,1000);

// ── G-FORCE RING ──
const canvas=document.getElementById('gforceCanvas');
const ctx=canvas.getContext('2d');
const ring=document.getElementById('gforceRing');
const speedNumEl=document.getElementById('speedEl');

// Size canvas to wrap speed number
function sizeCanvas(){
  const sz=speedNumEl.offsetWidth;
  const RING_SIZE=Math.max(sz*1.55, 160);
  canvas.width=RING_SIZE*window.devicePixelRatio;
  canvas.height=RING_SIZE*window.devicePixelRatio;
  canvas.style.width=RING_SIZE+'px';
  canvas.style.height=RING_SIZE+'px';
  ctx.scale(window.devicePixelRatio,window.devicePixelRatio);
  return RING_SIZE;
}

let ringSize=sizeCanvas();
window.addEventListener('resize',()=>{ ringSize=sizeCanvas(); });

// Smoothed G values — acelerômetro roda a ~100Hz, suavizamos levemente
let gLat=0, gLon=0; // lateral (curva), longitudinal (aceleração/frenagem)
const G_ALPHA=0.18; // suavização leve — resposta rápida mas sem tremer

// Colors within brand identity:
// braking  → vermelho Tesla  (#e82127)
// cornering→ branco frio     (#c8d0d8)
// accel    → laranja quente  (#f07030)
function gColor(gx, gy){
  // gy: positive = braking (forward force), negative = accelerating
  // gx: positive = right curve (force left), negative = left curve
  const brake  = Math.max(0,  gy); // braking dominant
  const accel  = Math.max(0, -gy); // accelerating dominant
  const corner = Math.abs(gx);

  const total=brake+accel+corner||1;

  // blend RGB
  const r_brake=[232,33,39],    // #e82127
        r_accel=[240,112,48],   // #f07030
        r_corner=[200,208,216]; // #c8d0d8

  let r=0,g=0,b=0;
  r=(r_brake[0]*brake + r_accel[0]*accel + r_corner[0]*corner)/total;
  g=(r_brake[1]*brake + r_accel[1]*accel + r_corner[1]*corner)/total;
  b=(r_brake[2]*brake + r_accel[2]*accel + r_corner[2]*corner)/total;
  return [Math.round(r),Math.round(g),Math.round(b)];
}

function drawRing(gx, gy){
  const W=ringSize, H=ringSize;
  ctx.clearRect(0,0,W,H);

  const cx=W/2, cy=H/2;
  const outerR=W/2-2;
  const ringW=outerR*0.10; // ring thickness ~10% of radius
  const innerR=outerR-ringW;

  const magnitude=Math.sqrt(gx*gx+gy*gy);
  if(magnitude<0.04){ return; } // below threshold — ring invisible

  // Direction of force offset (opposite to motion direction)
  // gx positive = lateral right → glow on LEFT of ring
  // gy positive = braking → glow on BOTTOM
  const angle=Math.atan2(gy, -gx); // angle of glow center on ring

  const intensity=Math.min(magnitude/0.6, 1); // 0.6g = full intensity
  const [cr,cg,cb]=gColor(gx,gy);

  // Glow spread: ~120° arc centered on force direction
  const spread=Math.PI * 0.65;

  // Draw glowing arc
  const gradient=ctx.createConicalGradient
    ? null // not widely supported, use radial instead
    : null;

  // Use multiple radial gradients to fake arc glow
  // Anchor point on ring perimeter in force direction
  const glowX=cx+Math.cos(angle)*(innerR+ringW/2);
  const glowY=cy+Math.sin(angle)*(innerR+ringW/2);

  const grd=ctx.createRadialGradient(glowX,glowY,0,glowX,glowY,outerR*0.85);
  grd.addColorStop(0,  `rgba(${cr},${cg},${cb},${0.90*intensity})`);
  grd.addColorStop(0.3,`rgba(${cr},${cg},${cb},${0.55*intensity})`);
  grd.addColorStop(0.7,`rgba(${cr},${cg},${cb},${0.15*intensity})`);
  grd.addColorStop(1,  `rgba(${cr},${cg},${cb},0)`);

  // Clip to ring donut shape
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,outerR,0,Math.PI*2);
  ctx.arc(cx,cy,innerR,0,Math.PI*2,true);
  ctx.clip();

  ctx.fillStyle=grd;
  ctx.fillRect(0,0,W,H);
  ctx.restore();

  // Soft outer halo (not clipped — bleeds slightly beyond ring)
  const halo=ctx.createRadialGradient(glowX,glowY,innerR*0.5,glowX,glowY,outerR*1.2);
  halo.addColorStop(0,`rgba(${cr},${cg},${cb},${0.10*intensity})`);
  halo.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
  ctx.fillStyle=halo;
  ctx.fillRect(0,0,W,H);
}

// Acelerômetro
function onMotion(e){
  const ax=e.accelerationIncludingGravity;
  if(!ax||ax.x===null)return;

  // Android: x=lateral, y=longitudinal (positive forward = braking feels negative)
  // We invert y so positive gy = braking sensation
  const rawLat= ax.x / 9.81;   // normalize to G units
  const rawLon=-ax.y / 9.81;   // invert: braking = positive

  gLat=gLat+(rawLat-gLat)*G_ALPHA;
  gLon=gLon+(rawLon-gLon)*G_ALPHA;
}

// Request DeviceMotion permission (iOS 13+) or just attach (Android)
function startMotion(){
  if(typeof DeviceMotionEvent!=='undefined' && typeof DeviceMotionEvent.requestPermission==='function'){
    DeviceMotionEvent.requestPermission().then(s=>{
      if(s==='granted') window.addEventListener('devicemotion',onMotion);
    }).catch(()=>{});
  } else {
    window.addEventListener('devicemotion',onMotion);
  }
}
startMotion();

// Render loop — 60fps, reads latest smoothed G values
function renderLoop(){
  ringSize=canvas.width/window.devicePixelRatio;
  drawRing(gLat, gLon);
  requestAnimationFrame(renderLoop);
}
requestAnimationFrame(renderLoop);

// ── GPS BARS ──
const bars=[1,2,3,4].map(i=>document.getElementById('b'+i));
const BAR_CLASSES=['q1','q2','q3','q4'];

function accToBars(acc){
  if(acc===null)return 0;
  if(acc<=6) return 4;
  if(acc<=15)return 3;
  if(acc<=40)return 2;
  if(acc<=100)return 1;
  return 0;
}

function renderBars(n){
  bars.forEach((b,i)=>{
    b.className='bar';
    if(i<n) b.classList.add(BAR_CLASSES[i]);
  });
}

// ── GPS STATE ──
const gpsDot=document.getElementById('gpsDot');
const gpsAcc=document.getElementById('gpsAcc');

function setGpsState(state,acc){
  gpsDot.className='gps-dot '+state;
  if(state==='none'){
    gpsAcc.textContent='sem sinal';
    renderBars(0);
  } else if(state==='acquiring'){
    gpsAcc.textContent=acc?`±${Math.round(acc)}m`:'localizando…';
    renderBars(accToBars(acc));
  } else {
    gpsAcc.textContent=`±${Math.round(acc)}m`;
    renderBars(accToBars(acc));
  }
}

// ── SPEED ──
const cardinalEl=document.getElementById('cardinalEl');
const compassSvg=document.getElementById('compassSvg');
const CARDINALS=['N','NE','L','SE','S','SO','O','NO'];

let lastPos=null, lastHeading=null, smoothKmh=0, lastDisplayed=-1;

const ALPHA_FAST=0.85, ALPHA_MED=0.60, ALPHA_SLOW=0.25;
function adaptiveAlpha(cur,tgt){
  const d=Math.abs(tgt-cur);
  return d>8?ALPHA_FAST:d>3?ALPHA_MED:ALPHA_SLOW;
}

function haversineKmh(p1,p2){
  const toR=d=>d*Math.PI/180,R=6371000;
  const dLat=toR(p2.lat-p1.lat),dLon=toR(p2.lon-p1.lon);
  const a=Math.sin(dLat/2)**2+Math.cos(toR(p1.lat))*Math.cos(toR(p2.lat))*Math.sin(dLon/2)**2;
  const dist=R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  const secs=(p2.ts-p1.ts)/1000;
  if(secs<0.1||secs>5)return null;
  return (dist/secs)*3.6;
}

function updateHeading(deg){
  lastHeading=deg;
  compassSvg.style.transform=`rotate(${-deg}deg)`;
  cardinalEl.textContent=CARDINALS[Math.round(deg/45)%8];
}

function onPosition(pos){
  const{latitude:lat,longitude:lon,speed,accuracy,heading}=pos.coords;
  const ts=pos.timestamp;
  const locked=accuracy<=50;
  setGpsState(locked?'locked':'acquiring',accuracy);

  let nativeKmh=(speed!==null&&speed>=0)?speed*3.6:null;
  let haverKmh=lastPos?haversineKmh(lastPos,{lat,lon,ts}):null;
  if(haverKmh!==null&&haverKmh>250)haverKmh=null;

  let rawKmh=null;
  if(nativeKmh!==null&&haverKmh!==null){
    rawKmh=locked?nativeKmh*0.7+haverKmh*0.3:nativeKmh*0.4+haverKmh*0.6;
  } else {
    rawKmh=nativeKmh??haverKmh??null;
  }

  if(rawKmh!==null){
    const alpha=adaptiveAlpha(smoothKmh,rawKmh);
    smoothKmh=smoothKmh+(rawKmh-smoothKmh)*alpha;
    if(smoothKmh<0.8)smoothKmh=0;
  } else if(smoothKmh>1){
    smoothKmh*=0.80;
  }

  const display=Math.round(smoothKmh);
  if(display!==lastDisplayed){
    speedEl.textContent=display;
    speedEl.classList.remove('dim');
    speedEl.classList.toggle('speeding',display>120);
    lastDisplayed=display;
  }

  if(heading!==null&&!isNaN(heading))updateHeading(heading);
  lastPos={lat,lon,ts};
}

function onError(){
  setGpsState('none',null);
  speedEl.textContent='—';
  speedEl.classList.add('dim');
  speedEl.classList.remove('speeding');
  smoothKmh=0;lastPos=null;lastDisplayed=-1;
}

// reuse speedEl ref from canvas section
const speedEl=document.getElementById('speedEl');

if('geolocation' in navigator){
  setGpsState('acquiring',null);
  navigator.geolocation.watchPosition(onPosition,onError,{
    enableHighAccuracy:true,maximumAge:0,timeout:10000
  });
} else {
  setGpsState('none',null);
}

window.addEventListener('deviceorientationabsolute',e=>{
  if(e.absolute&&e.alpha!==null)updateHeading(360-e.alpha);
},true);
window.addEventListener('deviceorientation',e=>{
  if(lastHeading===null&&e.alpha!==null)updateHeading(360-e.alpha);
});

// ── WAKE LOCK ──
const wakeBadge=document.getElementById('wakeBadge');
async function requestWake(){
  if(!('wakeLock' in navigator))return;
  try{const wl=await navigator.wakeLock.request('screen');wakeBadge.textContent='● tela ativa';wl.addEventListener('release',()=>{wakeBadge.textContent='';});}catch(_){wakeBadge.textContent='';}
}
requestWake();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')requestWake();});
</script>
