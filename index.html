<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Cluster</title>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0a0a" />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:             #0a0a0a;
      --surface:        #141414;
      --border:         rgba(255,255,255,0.07);
      --text-primary:   #ffffff;
      --text-dim:       rgba(255,255,255,0.22);
      --text-secondary: rgba(255,255,255,0.40);
      --accent:         #e82127;
      --accent-dim:     rgba(232,33,39,0.12);
      --warn:           #f5a623;
      --green:          #4cd964;
    }
    .light {
      --bg:             #efefef;
      --surface:        #f8f8f8;
      --border:         rgba(0,0,0,0.07);
      --text-primary:   #0d0d0d;
      --text-dim:       rgba(0,0,0,0.18);
      --text-secondary: rgba(0,0,0,0.38);
      --accent:         #e82127;
      --accent-dim:     rgba(232,33,39,0.10);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'DM Sans', sans-serif;
      transition: background .35s, color .35s;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* ── ROTATE SCREEN ── */
    #rotateScreen {
      display: none;
      position: fixed; inset: 0;
      background: var(--bg);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2vh;
    }
    #rotateScreen svg {
      width: 48px; height: 48px;
      fill: var(--text-secondary);
      animation: rotateHint 2s ease-in-out infinite;
    }
    #rotateScreen p {
      font-size: 13px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    @keyframes rotateHint {
      0%,100% { transform: rotate(0deg); }
      40%      { transform: rotate(-90deg); }
      60%      { transform: rotate(-90deg); }
    }
    @media (orientation: portrait) {
      #rotateScreen { display: flex; }
    }

    /* ── iOS SENSOR PERMISSION ── */
    #iosPermScreen {
      display: none;
      position: fixed; inset: 0;
      background: var(--bg);
      z-index: 2000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.4vh;
    }
    #iosPermScreen.show { display: flex; }
    .perm-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 20px; font-weight: 700;
      letter-spacing: .06em; color: var(--text-primary);
    }
    .perm-sub {
      font-size: 11px; letter-spacing: .14em;
      text-transform: uppercase; color: var(--text-secondary);
      text-align: center; max-width: 240px; line-height: 1.8;
    }
    .perm-btn {
      margin-top: .5vh; padding: .7em 2.2em;
      border-radius: 24px; border: 1px solid var(--accent);
      background: transparent; color: var(--accent);
      font-family: 'DM Sans', sans-serif; font-size: 12px;
      letter-spacing: .16em; text-transform: uppercase;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .perm-btn.secondary {
      border-color: var(--border); color: var(--text-secondary);
      margin-top: -.4vh; font-size: 10px;
    }




    /* ── MAIN LAYOUT ── */
    #app {
      width: 100vw; height: 100vh;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 4.5vw;
      gap: 3vw;
    }

    /* LEFT */
    .panel-left {
      display: flex;
      flex-direction: column;
      gap: 2.2vh;
      align-items: flex-start;
    }

    .compass-wrap { display: flex; flex-direction: column; gap: .5vh; }

    .lbl {
      font-size: clamp(7px, 1.2vw, 10px);
      font-weight: 500;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .compass-ring {
      width: clamp(52px, 9.5vw, 82px);
      height: clamp(52px, 9.5vw, 82px);
    }
    .compass-ring svg {
      width: 100%; height: 100%;
      transition: transform .55s cubic-bezier(.34,1.2,.64,1);
    }
    .cardinal {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(12px, 2vw, 17px);
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--text-primary);
      margin-top: .4vh;
    }
    .rule { width: 28px; height: 1px; background: var(--border); }
    .gps-row { display: flex; align-items: center; gap: .55em; }
    .gps-dot {
      width: 6px; height: 6px;
      border-radius: 50%; flex-shrink: 0;
      transition: background .4s, box-shadow .4s;
    }
    .gps-dot.none      { background: var(--text-dim); }
    .gps-dot.acquiring { background: var(--warn); box-shadow: 0 0 7px rgba(245,166,35,.35); animation: blink 1.1s infinite; }
    .gps-dot.locked    { background: var(--green); box-shadow: 0 0 7px rgba(76,217,100,.3); animation: blink 2.6s infinite; }
    .gps-dot.frozen    { background: var(--warn); box-shadow: none; animation: none; }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.35;} }
    .gps-acc { font-size: clamp(8px,1.3vw,11px); color: var(--text-secondary); letter-spacing: .04em; }

    .bars-wrap { display: flex; flex-direction: column; gap: .4vh; }
    .bars {
      display: flex; align-items: flex-end;
      gap: clamp(2px,.4vw,4px);
      height: clamp(12px,2.2vh,18px);
    }
    .bar {
      width: clamp(4px,.7vw,7px);
      border-radius: 2px 2px 1px 1px;
      background: var(--border);
      transition: background .5s ease;
    }
    .bar:nth-child(1){ height:25%; }
    .bar:nth-child(2){ height:50%; }
    .bar:nth-child(3){ height:75%; }
    .bar:nth-child(4){ height:100%; }
    .bar.q1 { background: #e82127; }
    .bar.q2 { background: #f5a623; }
    .bar.q3 { background: #f0d060; }
    .bar.q4 { background: #4cd964; }

    /* CENTER */
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gforce-ring {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #gforceCanvas {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      pointer-events: none;
      background: transparent;
      border-radius: 50%;
    }

    /* Pre-sized speed slots — no reflow between digit counts */
    .speed-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: baseline;
      justify-content: center;
      /* Reserve space for 3 digits always */
      min-width: 3ch;
    }

    /* Three size tiers, chosen by JS via data attribute */
    .speed-num {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      line-height: .88;
      letter-spacing: -.02em;
      color: var(--text-primary);
      text-align: center;
      width: 100%;
      transition: color .25s;
      white-space: nowrap;
    }
    /* 1 digit */
    .speed-wrap[data-digits="1"] { width: clamp(70px,13vw,110px); }
    .speed-wrap[data-digits="1"] .speed-num { font-size: clamp(90px,20vw,160px); }
    /* 2 digits */
    .speed-wrap[data-digits="2"] { width: clamp(110px,18vw,160px); }
    .speed-wrap[data-digits="2"] .speed-num { font-size: clamp(90px,20vw,160px); }
    /* 3 digits */
    .speed-wrap[data-digits="3"] { width: clamp(140px,22vw,200px); }
    .speed-wrap[data-digits="3"] .speed-num { font-size: clamp(72px,16vw,130px); }

    .speed-num.speeding { color: var(--accent); }
    .speed-num.dim { opacity: .25; }

    .unit {
      font-size: clamp(9px,1.7vw,14px);
      font-weight: 300;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-top: .6em;
    }



    /* RIGHT */
    .panel-right {
      display: flex;
      flex-direction: column;
      gap: 2.2vh;
      align-items: flex-end;
    }
    .time-val {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(20px,4.6vw,42px);
      font-weight: 500;
      letter-spacing: .02em;
      line-height: 1;
      color: var(--text-primary);
      text-align: right;
    }
    .time-date {
      font-size: clamp(7px,1.2vw,11px);
      color: var(--text-secondary);
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-top: .25em;
    }
    .icon-btn {
      display: flex; align-items: center; justify-content: center;
      width: clamp(30px,4.5vw,40px);
      height: clamp(30px,4.5vw,40px);
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      transition: transform .15s, background .3s;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-btn:active { transform: scale(.88); }
    .icon-btn svg { width: 42%; height: 42%; fill: var(--text-secondary); transition: fill .3s; }

    body::after {
      content:'';
      position:fixed; inset:0;
      background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.022) 3px,rgba(0,0,0,.022) 4px);
      pointer-events:none;
      z-index:998;
    }

    #installBtn {
      position:fixed; bottom:1.8vh; right:1.8vw;
      width:26px; height:26px;
      border-radius:50%;
      border:1px solid var(--border);
      background:var(--surface);
      display:none; align-items:center; justify-content:center;
      cursor:pointer; opacity:.45; z-index:500;
      transition:opacity .2s, transform .15s;
      -webkit-tap-highlight-color:transparent;
    }
    #installBtn.show { display:flex; }
    #installBtn:active { transform:scale(.88); opacity:1; }
    #installBtn svg { width:12px; height:12px; fill:var(--text-secondary); }

    #wakeBadge {
      position:fixed; bottom:1.6vh; left:50%; transform:translateX(-50%);
      font-size:8px; letter-spacing:.18em; text-transform:uppercase;
      color:var(--text-dim); pointer-events:none; z-index:400;
    }
  </style>
</head>
<body>

<!-- ROTATE HINT -->
<div id="rotateScreen">
  <svg viewBox="0 0 24 24"><path d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97 8.48m-1.51 4.13c-.4 1.2-1.1 2.3-2.02 3.23M5.85 5.85C4.06 7.66 3 10.15 3 12.9c0 3.87 2.16 7.25 5.37 9.03M3.34 3.34l17.32 17.32"/></svg>
  <p>Gire o dispositivo</p>
</div>


<!-- iOS SENSOR PERMISSION -->
<div id="iosPermScreen">
  <div class="perm-title">Sensores de movimento</div>
  <div class="perm-sub">O efeito de força G usa<br>o acelerómetro do dispositivo</div>
  <button class="perm-btn" id="iosPermBtn">Ativar sensores</button>
  <button class="perm-btn secondary" id="iosPermSkip">Saltar</button>
</div>

<!-- APP -->
<div id="app">

  <!-- LEFT -->
  <div class="panel-left">
    <div class="compass-wrap">
      <span class="lbl">Direção</span>
      <div class="compass-ring">
        <svg id="compassSvg" viewBox="0 0 82 82" fill="none">
          <circle cx="41" cy="41" r="39.5" stroke="var(--border)" stroke-width="1.2"/>
          <g stroke="var(--text-dim)" stroke-width="1">
            <line x1="41" y1="3"  x2="41" y2="10"/>
            <line x1="79" y1="41" x2="72" y2="41"/>
            <line x1="41" y1="79" x2="41" y2="72"/>
            <line x1="3"  y1="41" x2="10" y2="41"/>
          </g>
          <polygon points="41,9 38.5,41 41,47 43.5,41" fill="var(--accent)"/>
          <polygon points="41,73 38.5,41 41,35 43.5,41" fill="var(--text-dim)"/>
          <circle cx="41" cy="41" r="3.5" fill="var(--surface)" stroke="var(--border)" stroke-width="1.2"/>
        </svg>
      </div>
      <span class="cardinal" id="cardinalEl">—</span>
    </div>

    <div class="rule"></div>

    <div class="gps-row">
      <span class="gps-dot none" id="gpsDot"></span>
      <span class="gps-acc" id="gpsAcc">sem sinal</span>
    </div>

    <div class="bars-wrap">
      <span class="lbl">GPS</span>
      <div class="bars">
        <span class="bar" id="b1"></span>
        <span class="bar" id="b2"></span>
        <span class="bar" id="b3"></span>
        <span class="bar" id="b4"></span>
      </div>
    </div>
  </div>

  <!-- CENTER -->
  <div class="center">
    <div class="gforce-ring" id="gforceRing">
      <canvas id="gforceCanvas"></canvas>
      <div class="speed-wrap" id="speedWrap" data-digits="1">
        <div class="speed-num dim" id="speedEl">—</div>
      </div>
    </div>
    <div class="unit">km/h</div>
  </div>

  <!-- RIGHT -->
  <div class="panel-right">
    <div>
      <div class="time-val" id="timeEl">--:--</div>
      <div class="time-date" id="dateEl">—</div>
    </div>
    <div class="rule" style="margin-left:auto;"></div>
    <button class="icon-btn" id="themeBtn" aria-label="Tema">
      <svg id="themeIco" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</div>

<div id="wakeBadge"></div>
<button id="installBtn" aria-label="Instalar">
  <svg viewBox="0 0 24 24"><path d="M12 3v13m0 0l-4-4m4 4l4-4M3 18v2a1 1 0 001 1h16a1 1 0 001-1v-2"/></svg>
</button>

<script>
// ════════════════════════════════════════
//  PWA
// ════════════════════════════════════════
(function(){
  const m={name:"Tesla Cluster",short_name:"Cluster",start_url:"./",display:"fullscreen",orientation:"landscape",background_color:"#0a0a0a",theme_color:"#0a0a0a",icons:[{src:"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#0a0a0a" rx="80"/><text x="256" y="340" font-size="280" text-anchor="middle" font-family="sans-serif" fill="#e82127" font-weight="bold">T</text></svg>'),sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};
  const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/json'}));document.head.appendChild(l);
  if('serviceWorker' in navigator){const sw=`const C='cv4';self.addEventListener('install',e=>{self.skipWaiting();});self.addEventListener('activate',e=>{clients.claim();caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k))));});self.addEventListener('fetch',e=>{e.respondWith(caches.open(C).then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(res=>{c.put(e.request,res.clone());return res;}))).catch(()=>fetch(e.request)));});`;navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'})),{scope:'./'}).catch(()=>{});}
})();
let deferred=null;
const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;installBtn.classList.add('show');});
installBtn.addEventListener('click',async()=>{if(!deferred)return;deferred.prompt();const{outcome}=await deferred.userChoice;if(outcome==='accepted')installBtn.classList.remove('show');deferred=null;});
window.addEventListener('appinstalled',()=>installBtn.classList.remove('show'));

// ════════════════════════════════════════
//  THEME
// ════════════════════════════════════════
let dark=true;
const themeBtn=document.getElementById('themeBtn'),themeIco=document.getElementById('themeIco');
const MOON='M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z';
const SUN='M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41M12 6a6 6 0 1 0 0 12A6 6 0 0 0 12 6z';
themeBtn.addEventListener('click',()=>{dark=!dark;document.body.classList.toggle('light',!dark);themeIco.innerHTML=dark?`<path d="${MOON}"/>`:`<path d="${SUN}" fill="none" stroke="var(--text-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;});

// ════════════════════════════════════════
//  CLOCK
// ════════════════════════════════════════
const timeEl=document.getElementById('timeEl'),dateEl=document.getElementById('dateEl');
const DAYS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],MONTHS=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
function tick(){const n=new Date();timeEl.textContent=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;dateEl.textContent=`${DAYS[n.getDay()]} · ${n.getDate()} ${MONTHS[n.getMonth()]}`;}
tick();setInterval(tick,1000);



// ════════════════════════════════════════
//  G-FORCE RING
// ════════════════════════════════════════
const canvas=document.getElementById('gforceCanvas');
const ctx=canvas.getContext('2d');

function sizeCanvas(){
  const wrap=document.getElementById('speedWrap');
  const sz=Math.max(wrap.offsetWidth, wrap.offsetHeight);
  const RING=Math.max(sz*1.6, 180);
  const dpr=window.devicePixelRatio||1;
  canvas.width=RING*dpr; canvas.height=RING*dpr;
  canvas.style.width=RING+'px'; canvas.style.height=RING+'px';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr,dpr);
  return RING;
}
let ringSize=200;
window.addEventListener('load',()=>{ ringSize=sizeCanvas(); });
window.addEventListener('resize',()=>{ ringSize=sizeCanvas(); });

// G-force engine — calibrated, gravity-isolated
let gLat=0, gLon=0;            // smoothed display values
let gLatRaw=0, gLonRaw=0;      // last raw (after offset)
const G_SMOOTH=0.45;            // fast lerp — visual easing only
const G_VIS_THRESHOLD=0.04;     // below this magnitude, ring stays hidden

// Gravity offset calibration — captured from initial samples
let gOffX=0, gOffY=0, gOffZ=0;
let calibSamples=[];
let calibrated=false;
const CALIB_TARGET=40;          // ~0.7s @ 60Hz

// Aceleração derivada da velocidade GPS (fallback robusto)
let gpsAccelLon=0;              // m/s² estimado por delta de velocidade
let gpsTurnRate=0;              // mudança de heading

function gColor(gx,gy){
  const brake=Math.max(0,gy);
  const accel=Math.max(0,-gy);
  const corner=Math.abs(gx);
  const total=brake+accel+corner||1;
  const rb=[232,33,39], ra=[240,112,48], rc=[200,208,216];
  return [
    (rb[0]*brake+ra[0]*accel+rc[0]*corner)/total,
    (rb[1]*brake+ra[1]*accel+rc[1]*corner)/total,
    (rb[2]*brake+ra[2]*accel+rc[2]*corner)/total
  ].map(Math.round);
}

function drawRing(gx,gy){
  const W=ringSize,H=ringSize,cx=W/2,cy=H/2;
  ctx.clearRect(0,0,W,H);
  const mag=Math.sqrt(gx*gx+gy*gy);
  if(mag<G_VIS_THRESHOLD) return;

  const outerR=W/2-2, ringW=outerR*0.10, innerR=outerR-ringW;
  const intensity=Math.min(mag/0.55,1);
  const angle=Math.atan2(gy,-gx);
  const [cr,cg,cb]=gColor(gx,gy);
  const glowX=cx+Math.cos(angle)*(innerR+ringW/2);
  const glowY=cy+Math.sin(angle)*(innerR+ringW/2);

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,outerR,0,Math.PI*2);
  ctx.clip();

  const halo=ctx.createRadialGradient(glowX,glowY,innerR*0.3,glowX,glowY,outerR);
  halo.addColorStop(0,`rgba(${cr},${cg},${cb},${0.08*intensity})`);
  halo.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
  ctx.fillStyle=halo; ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,outerR,0,Math.PI*2);
  ctx.arc(cx,cy,innerR,0,Math.PI*2,true);
  ctx.clip();
  const grd=ctx.createRadialGradient(glowX,glowY,0,glowX,glowY,outerR*0.88);
  grd.addColorStop(0,   `rgba(${cr},${cg},${cb},${0.95*intensity})`);
  grd.addColorStop(0.25,`rgba(${cr},${cg},${cb},${0.58*intensity})`);
  grd.addColorStop(0.65,`rgba(${cr},${cg},${cb},${0.10*intensity})`);
  grd.addColorStop(1,   `rgba(${cr},${cg},${cb},0)`);
  ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);
  ctx.restore();

  ctx.restore();
}

// DeviceMotion — 3-priority gravity isolation
// P1: e.acceleration (OS sensor fusion, gravity already removed)
// P2: DeviceOrientation quaternion math removal
// P3: 20-sample static offset fallback (~0.3s)
let orientQuat={w:1,x:0,y:0,z:0};

window.addEventListener('deviceorientationabsolute',e=>{
  if(e.alpha===null)return;
  const a=e.alpha*Math.PI/180,b=e.beta*Math.PI/180,g=e.gamma*Math.PI/180;
  const ca=Math.cos(a/2),sa=Math.sin(a/2),cb=Math.cos(b/2),sb=Math.sin(b/2),cg=Math.cos(g/2),sg=Math.sin(g/2);
  orientQuat={w:ca*cb*cg+sa*sb*sg,x:ca*sb*cg-sa*cb*sg,y:ca*cb*sg+sa*sb*cg,z:sa*cb*cg-ca*sb*sg};
},true);

function removeGravity(ax,ay,az){
  const{w,x,y,z}=orientQuat;
  return [ax-2*(x*z-w*y)*9.81, ay-2*(y*z+w*x)*9.81, az-(w*w-x*x-y*y+z*z)*9.81];
}

function onMotion(e){
  const aG=e.acceleration, aW=e.accelerationIncludingGravity;
  let ax,ay,az;
  const hasOrient=(Math.abs(orientQuat.x)+Math.abs(orientQuat.y)+Math.abs(orientQuat.z))>0.01;

  if(aG&&aG.x!==null&&aG.x!==undefined&&(Math.abs(aG.x)+Math.abs(aG.y)+Math.abs(aG.z))>0.001){
    ax=aG.x;ay=aG.y;az=aG.z;calibrated=true;
  } else if(aW&&aW.x!==null&&hasOrient){
    [ax,ay,az]=removeGravity(aW.x,aW.y,aW.z);calibrated=true;
  } else if(aW&&aW.x!==null){
    if(!calibrated){
      calibSamples.push([aW.x,aW.y,aW.z]);
      if(calibSamples.length>=20){
        let sx=0,sy=0,sz=0;
        calibSamples.forEach(s=>{sx+=s[0];sy+=s[1];sz+=s[2];});
        gOffX=sx/20;gOffY=sy/20;gOffZ=sz/20;calibrated=true;calibSamples=[];
      }
      return;
    }
    ax=aW.x-gOffX;ay=aW.y-gOffY;az=aW.z-gOffZ;
  } else{return;}

  ax/=9.81;ay/=9.81;az/=9.81;

  const ang=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
  let rawLat,rawLon;
  if(ang===90){rawLat=ay;rawLon=-ax;}
  else if(ang===270||ang===-90){rawLat=-ay;rawLon=ax;}
  else{rawLat=ax;rawLon=-ay;}

  gLatRaw=rawLat;gLonRaw=rawLon;
  gLat=gLat+(rawLat-gLat)*G_SMOOTH;
  gLon=gLon+(rawLon-gLon)*G_SMOOTH;
}
// Tap canvas to force recalibration (P3 fallback)
canvas.addEventListener('click',()=>{calibrated=false;calibSamples=[];});

const iosPermScreen=document.getElementById('iosPermScreen');
const iosPermBtn=document.getElementById('iosPermBtn');
const iosPermSkip=document.getElementById('iosPermSkip');
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

function startMotion(){ window.addEventListener('devicemotion',onMotion); }

if(isIOS&&typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
  iosPermScreen.classList.add('show');
  iosPermBtn.addEventListener('click',()=>{
    DeviceMotionEvent.requestPermission().then(s=>{
      if(s==='granted')startMotion();
      iosPermScreen.classList.remove('show');
    }).catch(()=>iosPermScreen.classList.remove('show'));
  });
  iosPermSkip.addEventListener('click',()=>iosPermScreen.classList.remove('show'));
} else {
  startMotion();
}

function renderLoop(){
  ringSize = canvas.width/(window.devicePixelRatio||1);

  // Fuse phone accelerometer with GPS-derived motion
  // GPS signals: gpsAccelLon (m/s² long), gpsTurnRate (deg/s lateral proxy)
  // Convert GPS-derived to G units (1g = 9.81 m/s²)
  const gpsLonG  = -gpsAccelLon / 9.81;        // braking positive
  const gpsLatG  =  gpsTurnRate / 60;           // ~60 deg/s ≈ 1g cornering proxy

  // Blend: phone accel reacts immediately, GPS adds reliability when phone is calibrating
  const fusedLat = (calibrated ? gLat : 0) * 0.6 + gpsLatG * 0.4;
  const fusedLon = (calibrated ? gLon : 0) * 0.6 + gpsLonG * 0.4;

  drawRing(fusedLat, fusedLon);
  requestAnimationFrame(renderLoop);
}
requestAnimationFrame(renderLoop);

// ════════════════════════════════════════
//  GPS BARS
// ════════════════════════════════════════
const bars=[1,2,3,4].map(i=>document.getElementById('b'+i));
const BAR_Q=['q1','q2','q3','q4'];
function accToBars(acc){
  if(acc===null)return 0;
  if(acc<=6)return 4; if(acc<=15)return 3;
  if(acc<=40)return 2; if(acc<=100)return 1;
  return 0;
}
function renderBars(n){
  bars.forEach((b,i)=>{b.className='bar';if(i<n)b.classList.add(BAR_Q[i]);});
}

// ════════════════════════════════════════
//  GPS STATE + FREEZE
// ════════════════════════════════════════
const gpsDot=document.getElementById('gpsDot');
const gpsAcc=document.getElementById('gpsAcc');
let freezeTimer=null;
let frozen=false;

function setGpsState(state,acc){
  gpsDot.className='gps-dot '+state;
  if(state==='none'){gpsAcc.textContent='sem sinal';renderBars(0);}
  else if(state==='acquiring'){gpsAcc.textContent=acc?`±${Math.round(acc)}m`:'localizando…';renderBars(accToBars(acc));}
  else if(state==='frozen'){gpsAcc.textContent='sinal perdido';}
  else{gpsAcc.textContent=`±${Math.round(acc)}m`;renderBars(accToBars(acc));}
}

// ════════════════════════════════════════
//  SPEED + DIGITS
// ════════════════════════════════════════
const speedEl=document.getElementById('speedEl');
const speedWrap=document.getElementById('speedWrap');
const cardinalEl=document.getElementById('cardinalEl');
const compassSvg=document.getElementById('compassSvg');
const CARDINALS=['N','NE','L','SE','S','SO','O','NO'];

let lastPos=null,lastHeading=null,smoothKmh=0,lastDisplayed=-1;
// Kalman-lite — predict between fixes using estimated acceleration
let estAccel = 0;             // m/s² estimated longitudinal accel
let lastUpdateMs = 0;
const ALPHA_FAST=1.00, ALPHA_MED=0.70, ALPHA_SLOW=0.30;

function adaptiveAlpha(cur,tgt){
  const d=Math.abs(tgt-cur);
  return d>8?ALPHA_FAST:d>3?ALPHA_MED:ALPHA_SLOW;
}

// Predict speed forward using last known acceleration — runs in render loop
function predictSpeed(){
  if(!lastUpdateMs) return;
  const now = performance.now();
  const dt = (now - lastUpdateMs) / 1000;
  if(dt > 2.0) return; // stale, don't predict beyond 2s
  // Apply predicted accel between GPS fixes
  const predicted = smoothKmh + (estAccel * 3.6) * dt;
  smoothKmh = Math.max(0, predicted);
  lastUpdateMs = now;
}

// Loop predictor at high frequency for snappy display
setInterval(()=>{
  if(lastDisplayed === -1 || speedEl.classList.contains('dim')) return;
  predictSpeed();
  const display = Math.round(smoothKmh);
  if(display !== lastDisplayed){
    renderSpeed(smoothKmh);
  }
}, 100);

function haversineKmh(p1,p2){
  const toR=d=>d*Math.PI/180,R=6371000;
  const dLat=toR(p2.lat-p1.lat),dLon=toR(p2.lon-p1.lon);
  const a=Math.sin(dLat/2)**2+Math.cos(toR(p1.lat))*Math.cos(toR(p2.lat))*Math.sin(dLon/2)**2;
  const dist=R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  const secs=(p2.ts-p1.ts)/1000;
  if(secs<0.1||secs>5)return null;
  return(dist/secs)*3.6;
}

function updateHeading(deg){
  lastHeading=deg;
  compassSvg.style.transform=`rotate(${-deg}deg)`;
  cardinalEl.textContent=CARDINALS[Math.round(deg/45)%8];
}

function digitCount(n){ return n>=100?3:n>=10?2:1; }

function renderSpeed(kmh, dim=false){
  const display=Math.round(kmh);
  const digits=dim?1:digitCount(display);

  if(display!==lastDisplayed||dim){
    speedEl.textContent = dim ? '—' : display;
    speedWrap.setAttribute('data-digits', String(digits));
    speedEl.classList.toggle('dim', dim);

    speedEl.classList.remove('overlimit');

    lastDisplayed=display;
    // Resize canvas after digit change
    setTimeout(()=>{ ringSize=sizeCanvas(); },50);
  }
}

function onPosition(pos){
  const{latitude:lat,longitude:lon,speed,accuracy,heading}=pos.coords;
  const ts=pos.timestamp;

  if(freezeTimer){ clearTimeout(freezeTimer); freezeTimer=null; frozen=false; }

  const locked=accuracy<=50;
  setGpsState(locked?'locked':'acquiring',accuracy);

  let nativeKmh=(speed!==null&&speed>=0)?speed*3.6:null;
  let haverKmh=lastPos?haversineKmh(lastPos,{lat,lon,ts}):null;
  if(haverKmh!==null&&haverKmh>250)haverKmh=null;

  let rawKmh=null;
  if(nativeKmh!==null&&haverKmh!==null){
    rawKmh=locked?nativeKmh*0.7+haverKmh*0.3:nativeKmh*0.4+haverKmh*0.6;
  } else {
    rawKmh=nativeKmh??haverKmh??null;
  }

  // Compute estimated longitudinal acceleration from speed delta
  if(rawKmh !== null && lastPos){
    const dtSec = (ts - lastPos.ts) / 1000;
    if(dtSec > 0.05 && dtSec < 5){
      const prevMs = smoothKmh / 3.6;
      const newMs  = rawKmh / 3.6;
      const accelInst = (newMs - prevMs) / dtSec;
      // Smooth estAccel a bit
      estAccel = estAccel + (accelInst - estAccel) * 0.5;
      gpsAccelLon = estAccel;
    }
    // Heading delta → turn rate (deg/s)
    if(heading !== null && lastHeading !== null && dtSec > 0){
      let dh = heading - lastHeading;
      if(dh > 180) dh -= 360;
      if(dh < -180) dh += 360;
      gpsTurnRate = dh / dtSec;
    }
  }

  if(rawKmh!==null){
    const alpha=adaptiveAlpha(smoothKmh,rawKmh);
    smoothKmh=smoothKmh+(rawKmh-smoothKmh)*alpha;
    if(smoothKmh<0.8)smoothKmh=0;
    lastUpdateMs = performance.now();
  } else if(smoothKmh>1){
    // Symmetric decay — same aggressiveness as accel
    smoothKmh = smoothKmh + (0 - smoothKmh) * 0.35;
    estAccel  = estAccel  + (0 - estAccel) * 0.5;
  }

  renderSpeed(smoothKmh);

  // Set freeze timer — if no update for 5s, freeze display
  freezeTimer=setTimeout(()=>{
    frozen=true;
    setGpsState('frozen',null);
    // Keep showing last speed but mark dot as frozen
  },5000);

  if(heading!==null&&!isNaN(heading))updateHeading(heading);
  lastPos={lat,lon,ts};
}

function onError(){
  if(freezeTimer){clearTimeout(freezeTimer);freezeTimer=null;}
  frozen=false;
  setGpsState('none',null);
  renderSpeed(0,true);
  smoothKmh=0;lastPos=null;lastDisplayed=-1;
}

if('geolocation' in navigator){
  setGpsState('acquiring',null);
  navigator.geolocation.watchPosition(onPosition,onError,{
    enableHighAccuracy:true,maximumAge:0,timeout:10000
  });
} else {
  setGpsState('none',null);
  hideSplash();
}

// Compass fallback
window.addEventListener('deviceorientationabsolute',e=>{
  if(e.absolute&&e.alpha!==null)updateHeading(360-e.alpha);
},true);
window.addEventListener('deviceorientation',e=>{
  if(lastHeading===null&&e.alpha!==null)updateHeading(360-e.alpha);
});

// ════════════════════════════════════════
//  WAKE LOCK
// ════════════════════════════════════════
const wakeBadge=document.getElementById('wakeBadge');
async function requestWake(){
  if(!('wakeLock' in navigator))return;
  try{const wl=await navigator.wakeLock.request('screen');wakeBadge.textContent='● tela ativa';wl.addEventListener('release',()=>{wakeBadge.textContent='';});}catch(_){wakeBadge.textContent='';}
}
requestWake();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')requestWake();});
</script>
